# Current VIGOR E2 environment; these are not historical paper-table pins.
[project]
name = "bevsplat"
version = "0.1.0"
description = "BevSplat: Resolving Height Ambiguity via Feature-Based Gaussian Primitives for Weakly-Supervised Cross-View Localization (NeurIPS 2025)"
readme = "README.md"
requires-python = ">=3.10,<3.12"

dependencies = [
  # Deep learning backbone
  "torch==2.4.1",
  "torchvision==0.19.1",
  "timm==1.0.9",
  "e3nn==0.5.4",
  "einops==0.8.0",
  "jaxtyping==0.2.34",
  # Numerical / scientific
  "numpy==1.26.4",
  "scipy==1.14.1",
  "pandas==2.2.3",
  "scikit-image==0.24.0",
  # Imaging / visualization (open3d & plotly are imported at module-load
  # time by gaussian/encoder_pano.py even though the model itself doesn't
  # call them — they're cheap to install and avoid edit-the-source detours)
  "Pillow==10.4.0",
  "matplotlib==3.9.2",
  "opencv-python==4.10.0.84",
  "open3d==0.18.0",
  "plotly==5.24.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.0"]

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------

[tool.uv]
# Repo itself isn't installed as a package — kitti_main/ and vigor_main/
# are run via ``python -m`` from the repo root.
package = false

# Pin torch to the cu118 wheel index for reproducibility. If you need a
# different toolkit, swap ``cu118`` to ``cu121`` / ``cu124`` / ``cpu`` in
# both the URL and the source name. ``uv lock`` will pick the matching
# wheels.
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
